<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#83cbd3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="一座会从一个人开始的小岛。建小屋、迎旅人，看居民在海风里过日子。"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css?v=16"><title>航途小岛 · 在主岛安个家</title></head><body><main id="game"><canvas id="world" tabindex="0" aria-label="小岛画面，可拖动、双指缩放。也可以通过下方设施按钮解锁和升级。"></canvas><div class="vignette"></div><header class="hud"><button id="islandInfo" class="island-badge glass" aria-label="小岛发展手记"><span class="island-mark">⌂</span><span><strong>航途小岛</strong><small id="levelLabel">初来乍到</small></span></button><div class="wallet glass"><span class="coin">✦</span><strong id="coins">100</strong><small id="rate">+0 / 秒</small></div></header><div class="top-line"><span id="population">1 位岛民 · 初来乍到</span><button id="settings" class="round glass" aria-label="打开设置">☰</button></div><button class="quest glass" id="quest"><span class="quest-icon">✧</span><span><small>岛主手记</small><strong id="questText">建造第一层住宅</strong></span><span id="questReward">1人 · 50✦</span></button><div id="autoControl" class="auto-control glass"><button id="autoToggle" aria-pressed="false">▷ 自动玩</button><span id="autoStatus" role="status">手动经营 · 随时交给 AI</span></div><button id="visitorControl" class="visitor-control glass">♧ 来访 0 · 想留下 0</button><div id="selectionHint" hidden><span id="selectionText"></span><button id="cancelBuild">取消</button></div><div class="scene-tools"><button id="zoomIn" class="round glass" aria-label="放大小岛">＋</button><button id="zoomOut" class="round glass" aria-label="缩小小岛">－</button><button id="recenter" class="round glass" aria-label="回到小岛中心">⌖</button><button id="zen" class="round glass" aria-label="隐藏操作，静静看岛">◉</button></div><button i
